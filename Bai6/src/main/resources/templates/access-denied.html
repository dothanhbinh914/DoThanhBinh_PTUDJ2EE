<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Không có quyền truy cập</title>
    <style th:fragment="extra-styles">
        .denied-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 20px;
        }

        .denied-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(238, 90, 36, 0.3); }
            50%       { transform: scale(1.05); box-shadow: 0 15px 40px rgba(238, 90, 36, 0.5); }
        }

        .denied-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 15px;
        }

        .denied-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .denied-message {
            color: #718096;
            font-size: 1rem;
            max-width: 420px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .denied-message strong {
            color: #e53e3e;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .btn-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="denied-container">
            <div class="denied-icon">
                <i class="fas fa-lock"></i>
            </div>

            <div class="denied-code">403</div>

            <h1 class="denied-title">Không có quyền truy cập!</h1>

            <p class="denied-message">
                Tài khoản của bạn (<strong sec:authentication="name"></strong>)
                không có đủ quyền để thực hiện thao tác này.
                Chức năng này chỉ dành cho <strong>ADMIN</strong>.
            </p>

            <div class="role-badge">
                <i class="fas fa-user-tag"></i>
                Vai trò hiện tại: <span sec:authentication="principal.authorities"></span>
            </div>

            <a th:href="@{/books}" class="btn-back">
                <i class="fas fa-arrow-left"></i> Quay lại danh sách sách
            </a>
        </div>
    </div>
</body>
</html>
