<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Không có quyền truy cập</title>
</head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <div class="mb-4" style="font-size:5rem; background:linear-gradient(135deg,#ef4444,#dc2626); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">403</div>
        <div class="mb-3" style="font-size:3rem;"><i class="fas fa-lock text-danger"></i></div>
        <h3 class="fw-bold text-dark">Không có quyền truy cập!</h3>
        <p class="text-muted">
            Tài khoản <strong sec:authentication="name"></strong> không có quyền thực hiện thao tác này.
        </p>
        <a th:href="@{/home}" class="btn btn-primary mt-3 px-4 rounded-pill">
            <i class="fas fa-arrow-left me-2"></i>Quay về trang chủ
        </a>
    </div>
</div>
</body>
</html>
