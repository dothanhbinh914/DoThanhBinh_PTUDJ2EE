<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm học phần</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header" style="background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; border-radius:12px 12px 0 0; padding:1rem 1.5rem;">
                    <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Thêm học phần mới</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger py-2">
                        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/admin/courses/add}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên học phần <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control"
                                   th:value="${course.name}" placeholder="Nhập tên học phần" required/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Số tín chỉ <span class="text-danger">*</span></label>
                                <input type="number" name="credits" class="form-control" min="1" max="10"
                                       th:value="${course.credits}" placeholder="VD: 3" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Giảng viên <span class="text-danger">*</span></label>
                                <input type="text" name="lecturer" class="form-control"
                                       th:value="${course.lecturer}" placeholder="Tên giảng viên" required/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Danh mục</label>
                            <select name="category.id" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Hình ảnh minh họa</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*"/>
                            <small class="text-muted">Định dạng: JPG, PNG, GIF (tối đa 10MB)</small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save me-2"></i>Lưu học phần
                            </button>
                            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary px-4">
                                <i class="fas fa-arrow-left me-2"></i>Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
