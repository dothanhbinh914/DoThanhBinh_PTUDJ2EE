<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Quản lý học phần</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0"><i class="fas fa-cogs me-2 text-primary"></i>Quản lý Học Phần</h4>
            <small class="text-muted">Tổng: <span th:text="${#lists.size(courses)}"></span> học phần</small>
        </div>
        <a th:href="@{/admin/courses/add}" class="btn btn-primary rounded-pill px-4">
            <i class="fas fa-plus me-2"></i>Thêm học phần
        </a>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show py-2">
        <i class="fas fa-check-circle me-2"></i>
        <span th:if="${param.success[0] == 'add'}">Thêm học phần thành công!</span>
        <span th:if="${param.success[0] == 'edit'}">Cập nhật học phần thành công!</span>
        <span th:if="${param.success[0] == 'delete'}">Xóa học phần thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Hình ảnh</th>
                        <th>Tên học phần</th>
                        <th>Tín chỉ</th>
                        <th>Giảng viên</th>
                        <th>Danh mục</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="7" class="text-center text-muted py-4">Chưa có học phần nào</td>
                    </tr>
                    <tr th:each="course, idx : ${courses}">
                        <td th:text="${idx.count}" class="text-muted small"></td>
                        <td>
                            <img th:if="${course.image != null and !course.image.isEmpty()}"
                                 th:src="@{/images/{img}(img=${course.image})}"
                                 width="60" height="45" style="object-fit:cover; border-radius:6px;"/>
                            <div th:unless="${course.image != null and !course.image.isEmpty()}"
                                 style="width:60px;height:45px;background:#e0e7ff;border-radius:6px;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-image text-primary"></i>
                            </div>
                        </td>
                        <td class="fw-semibold" th:text="${course.name}"></td>
                        <td><span class="badge" style="background:#e0e7ff;color:#4f46e5;" th:text="${course.credits} + ' TC'"></span></td>
                        <td th:text="${course.lecturer}"></td>
                        <td>
                            <span th:if="${course.category != null}"
                                  class="badge" style="background:#f3e8ff;color:#7c3aed;"
                                  th:text="${course.category.name}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Bạn có chắc muốn xóa học phần này?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
