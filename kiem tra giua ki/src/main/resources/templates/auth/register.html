<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng ký - CourseReg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #4f46e5, #7c3aed); font-family: 'Segoe UI', sans-serif; }
        .register-card { background: white; border-radius: 18px; box-shadow: 0 20px 60px rgba(79,70,229,.3); padding: 40px; width: 100%; max-width: 460px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; margin-bottom: 12px; }
        .brand h2 { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
        .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 .2rem rgba(79,70,229,.15); }
        .btn-register { background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none; color: white; font-weight: 600; padding: 11px; border-radius: 10px; width: 100%; font-size: 1rem; transition: .2s; }
        .btn-register:hover { opacity: .9; color: white; transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="register-card">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-user-graduate"></i></div>
        <h2>Đăng ký tài khoản</h2>
        <p class="text-muted small">Tạo tài khoản sinh viên để đăng ký học phần</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light" style="color:#4f46e5;"><i class="fas fa-user"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="Nhập username" required minlength="3"/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light" style="color:#4f46e5;"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control"
                       placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" required minlength="6"/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Email</label>
            <div class="input-group">
                <span class="input-group-text bg-light" style="color:#4f46e5;"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control"
                       placeholder="Nhập email" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-register">
            <i class="fas fa-user-plus me-2"></i>Đăng ký
        </button>
    </form>

    <p class="text-center mt-3 text-muted small">
        Đã có tài khoản?
        <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color:#4f46e5;">Đăng nhập</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
